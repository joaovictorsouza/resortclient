[package]
name = "animals"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Reusable Bevy plugin for toon-shaded animals driven from outside (species, breeds, coats, LOD, animation)"

[dependencies]
bevy = { workspace = true, default-features = false, features = ["3d_bevy_render", "scene", "bevy_animation", "bevy_gltf", "bevy_log"] }
toon_avatar = { path = "../toon_avatar" }
