[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/nakama_client",
    "crates/game",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
bevy = "0.20"
avian3d = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.44", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures-util = "0.3"
crossbeam-channel = "0.5"
uuid = { version = "1.15", features = ["v4"] }
base64 = "0.22"
thiserror = "2.0"

[profile.dev.package."*"]
opt-level = 3

# iOS, kmp-host: bevy-kmp renders from its own thread, so wgpu creates the CAMetalLayer off the main
# thread, which stock raw-window-metal forbids. The patched copy lives in the bevy_kmp repository
# (third_party/raw-window-metal); cargo finds the crate by name inside the git repository.
# Keep the tag equal to the bevy-kmp-ffi tag in crates/game/Cargo.toml.
[patch.crates-io]
raw-window-metal = { git = "https://gitlab.com/joaovictorsouza/bevy_kmp", tag = "v0.1.5" }
