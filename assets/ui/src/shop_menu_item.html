<template>
    <property name="key">all</property>
    <property name="label">Categoria</property>
    <property name="icon">ui/icons/package.png</property>
    <property name="chevron">ui/icons/caret-right.png</property>
    <property name="chevron_display">none</property>
    <property name="bg">#1e293b</property>
    <property name="text_color">#f1f5f9</property>
    <property name="icon_color">#cbd5e1</property>
    <property name="indent">0px</property>
    <!-- Dynamic styles are not compiled on the template root: wrap the button. -->
    <node class="flex w-full">
    <!-- Fixed height: a long label is cut, never wrapped onto a second line. -->
    <button on_press="shop_select_category" tag:key="{key}" class="flex flex-row items-center gap-2 w-full h-9 shrink-0 px-2 rounded-lg hover:bg-slate-700 duration-150" background="{bg}" overflow="hidden hidden">
        <node class="h-full shrink-0" width="{indent}"/>
        <image src="{icon}" class="w-4 h-4 shrink-0" image_color="{icon_color}"/>
        <node class="flex flex-1 min-w-[0px] items-center h-full overflow-hidden">
            <text class="font-ui text-sm" text_layout="left no_wrap" font_color="{text_color}">{label}</text>
        </node>
        <image src="{chevron}" display="{chevron_display}" class="w-3 h-3 shrink-0" image_color="{icon_color}"/>
    </button>
    </node>
</template>
