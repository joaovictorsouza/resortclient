name: build-ios

# Manual build of the iOS IPA (KMP host in kmp/iosApp), UNSIGNED for now: it compiles and packs the app but
# does not install on a device until it is signed. Signing (certificate and profile from the Environment's secrets)
# is a later step; see ai-docs/decisions/0012-*.md.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment (selects environments/<name>.env and the GitHub Environment)
        type: choice
        options: [dev, prod]
        required: true
        default: dev

permissions:
  contents: read

concurrency:
  group: build-ios-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  ipa:
    runs-on: macos-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 120
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      SIGNING: none
      NAKAMA_SERVER_KEY: ${{ secrets.NAKAMA_SERVER_KEY }}
      BUILDS_R2_ACCOUNT_ID: ${{ secrets.BUILDS_R2_ACCOUNT_ID }}
      BUILDS_R2_BUCKET: ${{ secrets.BUILDS_R2_BUCKET }}
      BUILDS_R2_ACCESS_KEY_ID: ${{ secrets.BUILDS_R2_ACCESS_KEY_ID }}
      BUILDS_R2_SECRET_ACCESS_KEY: ${{ secrets.BUILDS_R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check where the IPA will go before spending build minutes
        run: scripts/ci/deliver-build.sh --check "$ENVIRONMENT"
      - name: Tools
        run: |
          brew install xcodegen
          rustup show
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: Swatinem/rust-cache@v2
      - name: Build unsigned iOS app (KMP host)
        working-directory: kmp/iosApp
        run: |
          xcodegen generate
          xcodebuild -project iosApp.xcodeproj -scheme iosApp -configuration Release \
            -destination generic/platform=iOS -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Pack unsigned IPA
        run: |
          APP=$(find kmp/iosApp/build/Build/Products -name 'iosApp.app' -maxdepth 3 | head -1)
          mkdir -p target/ios/export/Payload
          cp -R "$APP" target/ios/export/Payload/
          (cd target/ios/export && zip -qry new_game-unsigned.ipa Payload)
      - name: Deliver IPA
        run: scripts/ci/deliver-build.sh "$ENVIRONMENT" target/ios/export/new_game-unsigned.ipa "resort-${ENVIRONMENT}-${GITHUB_RUN_NUMBER}-unsigned.ipa"
      - name: Short-lived artifact (dev only, when no private bucket is configured)
        if: ${{ inputs.environment == 'dev' && env.BUILDS_R2_BUCKET == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: resort-dev-ipa-unsigned
          path: target/ios/export/new_game-unsigned.ipa
          retention-days: 1
